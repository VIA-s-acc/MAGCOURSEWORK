[project]
name = "magcoursework"
version = "0.1.0"
description = "Магистерская курсовая ВМК МГУ: оптимизация обновления EPD."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Georgii Akhroian", email = "akhroyan42@gmail.com" }
]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "pyserial>=3.5",
    "scikit-image>=0.22",
    "pandas>=2.2",
    "tqdm>=4.66",
    "jupyterlab>=4.0",
]

[project.optional-dependencies]
# Камера для фотостанда (гл. 7). Нужна только для потокового/UVC-захвата;
# IP Webcam по URL вида http://IP:8080/shot.jpg работает без opencv.
camera = [
    "opencv-python>=4.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "opencv-python>=4.9",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["python*"]
exclude = ["tests*", "notebook*", "docs*", "tex*", "firmware*", "dist*"]

# ---- pytest --------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=python",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=70",
]
pythonpath = ["."]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:jupyter_client.*",
    "ignore::DeprecationWarning:dateutil.*",
]

# ---- coverage ------------------------------------------------------------
[tool.coverage.run]
source = ["python"]
omit = ["python/__init__.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# ---- ruff (linter) -------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle + pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C90",           # mccabe (complexity)
    "N",             # pep8-naming
]
ignore = [
    "E501",  # line too long — handled by formatter
]

# ---- mypy (type checker) -------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # gradual typing, не строгий
ignore_missing_imports = true   # для научных библиотек
